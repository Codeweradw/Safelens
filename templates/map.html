<!DOCTYPE html>
<html>
<head>
  <title>SafeLens – Pangasinan Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body { margin: 0; }
    #map {
      height: 100vh;
      background: #F5F5F5;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Initialize map centered on Pangasinan
  const map = L.map('map').setView([16.0, 120.3], 9);

  // Light basemap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Load Pangasinan GeoJSON
  fetch('/static/data/pangasinan_municipalities.geojson')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: {
          color: '#1E88E5',
          weight: 1,
          fillColor: '#3DC4FF',
          fillOpacity: 0.6
        },
        onEachFeature: (feature, layer) => {
          layer.bindPopup(
            `<strong>${feature.properties.MUNICIPALITY}</strong>`
          );
        }
      }).addTo(map);
    });
</script>

</body>
</html>
